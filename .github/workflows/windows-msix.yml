name: Windows MSIX

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Windows app
        run: flutter build windows --release
      - name: Create 20-year development certificate
        shell: pwsh
        run: .\tool\create_dev_certificate.ps1
      - name: Create signed MSIX
        shell: pwsh
        run: |
          $certificate = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -eq 'CN=My Torrent' -and $_.HasPrivateKey -and $_.NotAfter -gt (Get-Date) } |
            Sort-Object NotAfter -Descending |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw 'Certificado de desenvolvimento não encontrado em CurrentUser\My.'
          }

          $arguments = @('run', 'msix:create', '--build-windows', 'false', '--sign-msix', 'true', '--install-certificate', 'false', '--signtool-options', "/v /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $($certificate.Thumbprint)")
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw 'A tag de release deve ter o formato vMAJOR.MINOR.PATCH.'
            }
            $major, $minor, $patch = $Matches[1..3]
            $releaseVersion = "$major.$minor.$patch"
            $pubspecVersion = ((Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value).Trim()
            if ($pubspecVersion -notmatch "^$([regex]::Escape($releaseVersion))(\+\d+)?$") {
              throw "A tag $env:GITHUB_REF_NAME deve corresponder a version: $pubspecVersion no pubspec.yaml."
            }
            $arguments += @('--version', "$releaseVersion.0")
          }
          & dart @arguments
      - name: Upload installer and certificate
        uses: actions/upload-artifact@v4
        with:
          name: my-torrent-msix
          path: |
            build/windows/**/Release/*.msix
            certificates/my-torrent-dev.cer
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download installer and certificate
        uses: actions/download-artifact@v4
        with:
          name: my-torrent-msix
          path: release
      - name: Locate release assets
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE\release" -Filter '*.msix' -File -Recurse)
          if ($installers.Count -ne 1) {
            throw "Expected one MSIX file, found $($installers.Count)."
          }
          $certificates = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE\release" -Filter '*.cer' -File -Recurse)
          if ($certificates.Count -ne 1) {
            throw "Expected one certificate file, found $($certificates.Count)."
          }
          "MSIX_PATH=$($installers[0].FullName)" | Add-Content -Path $env:GITHUB_ENV
          "CERTIFICATE_PATH=$($certificates[0].FullName)" | Add-Content -Path $env:GITHUB_ENV
      - name: Trust release certificate for verification
        shell: pwsh
        run: Import-Certificate -FilePath $env:CERTIFICATE_PATH -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
      - name: Verify signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -FilePath $env:MSIX_PATH
          if ($signature.Status -ne 'Valid') {
            throw "MSIX signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.MSIX_PATH }}
            ${{ env.CERTIFICATE_PATH }}
